url: https://github.com/Velestia-star/dsh-docdesk
name: Velestia-star/dsh-docdesk
category: docs
description:
  en: An add-only materials library for DeepSeek Harness with a workspace file picker covering Markdown, text/code, HTML, images, PDF, audio and video, plus per-type icons and picker type filters; a fixed icon grid with pointer-first hysteresis drag targeting; marquee selection and bulk folder moves; drag-to-folder and dissolve/delete folder actions; persistent move and line highlights; full-screen tabs, immersive reading, GFM tables, bookmarks and local Mermaid/chart rendering; plus sandboxed HTML preview with same-folder assets, Shift+wheel image zoom with click-to-full-screen, a compact image page with labelled actions, and native PDF/audio/video viewers. Formats a browser cannot preview, such as Office documents and archives, are not listed.
  zh: 只收主动加入的资料，选择器覆盖 Markdown、纯文本/代码、HTML、图片、PDF、音频与视频，每类文件有独立图标并可按类型筛选；支持工作区挑选、带指针滞回的固定网格拖拽、右键框选与批量移入文件夹、文件夹解散/删除、移动与行高亮持久标记、全屏标签页与沉浸式阅读、GFM 表格、书签和 Mermaid/代码块图表本地渲染，另有 HTML 沙箱预览（同目录资源可用）、Shift+滚轮缩放与点按全屏图片、紧凑的图片页（带文字标签的操作按钮）和 PDF/音视频播放；浏览器无法预览的 Office 文档、压缩包等不会列出。
icon: https://raw.githubusercontent.com/Velestia-star/dsh-docdesk/main/docs/icon.png
